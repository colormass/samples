<!doctype html>
<html>
    <head>
        <link rel="preconnect" href="http://localhost:4300" />
        <!-- Load the colormass configurator styles -->
        <link href="http://localhost:4300/styles.css" rel="stylesheet" />
        <!-- Load the colormass configurator web components -->
        <script src="http://localhost:4300/cm-configurator.js" type="module"></script>

        <title>Configurator Web Component Example</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            :root {
                /* Available css variables */
                --cm-menu-max-num-cols: 8;
                --cm-menu-icon-size: 65px;
                --cm-menu-gap: 10px;
                /* 16px covers Chrome thin-scrollbar variance across OS themes. */
                --cm-scrollbar-buffer: 16px;
                /* Indent for second-level accordion content (an expanded
                   section's groups and icon rows in autoClose mode). Part of
                   the accordion width caps below, so the full icon column
                   count still fits next to it. */
                --cm-section-indent: 8px;
                --cm-menu-background-color: rgba(255, 255, 255, 0);
                --cm-tooltip-font-size: 14px;
                --cm-tooltip-background-color: gray;
                font-family: "Roboto";
                /* Theme accent — used for selected/hover states on pills and
                   config buttons. */
                --section-color: #049095;
                --section-inactive-bg: #b2b4b9;
                --section-inactive-color: white;
            }

            /* Container-query anchor: the embed responds to the width the
               surrounding page actually gives it, not to the viewport. CMS
               themes cap and pad their content column in steps (e.g. Tailwind
               contained rows: 640/768/1024/1280/1536px), so viewport-based
               breakpoints misfire when this example is pasted into one. */
            .cm-configurator-wrapper {
                container-type: inline-size;
                container-name: cm-embed;
            }

            /* Named cm-* so CMS themes can't restyle it — Tailwind/Bootstrap
               ship a global `.container` class (stepped max-width, padding,
               centering) that hijacks that name when embedded.
               Explicit height: embeds have no html/body height cascade. */
            .cm-embed {
                display: flex;
                height: min(85svh, 900px);
                overflow: hidden;
            }

            /* Fullscreen (via the viewer's fullscreen button + the
               fullscreen-target attribute on cm-configurator-main): the whole
               wrapper is fullscreened, so the embed keeps its styled external
               menu. Fill the screen instead of the embedded 85svh height and
               paint the backdrop (the fullscreen backdrop is black by default). */
            .cm-configurator-wrapper:fullscreen {
                background: white;
            }

            .cm-configurator-wrapper:fullscreen .cm-embed {
                height: 100%;
            }

            /* Safari < 16.4 uses the prefixed selector; keep as separate rules —
               an unknown selector in a shared list would invalidate the block. */
            .cm-configurator-wrapper:-webkit-full-screen {
                background: white;
            }

            .cm-configurator-wrapper:-webkit-full-screen .cm-embed {
                height: 100%;
            }

            .cm-menu {
                justify-content: center;
                width: 15%;
                background-color: #eef0f1;
                /* Inner icons-container scrolls; clip anything that spills. */
                overflow: hidden;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                /* Fits the accordion width cap (496px = 5 × 80px icons +
                   4 × 10px gap + 20px outer padding + 12px icons-container
                   padding + 8px section indent + 16px scrollbar buffer) plus
                   the platform menu's 16px internal padding and its whole-menu
                   scrollbar (appears in autoClose mode once enough groups are
                   expanded, ~17px). With this headroom the cap stays the
                   binding constraint, so icon rows never rewrap when that
                   scrollbar comes and goes. */
                min-width: 540px;
            }

            /* Opt the host into the height cascade so the inner icons-container
               can have a bounded scroll region. Default platform behavior is
               content-sized; we explicitly fill the menu's height here. */
            .cm-menu cm-configurator-menu {
                display: block;
                height: 100%;
            }

            /* Group title: fully-rounded pill, uppercase, left-aligned title.
               position: relative anchors the absolutely-positioned forward chevron
               so it pins to the right edge while the text stays at the left.
               Back chevron flows inline (only present in stepped-into state). */
            ::part(cm-config-group-title) {
                position: relative;
                border: none;
                background-color: var(--section-inactive-bg);
                padding: 8px 36px 8px 18px;
                color: var(--section-inactive-color);
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                border-radius: 999px;
                justify-content: flex-start;
            }

            /* Avoid sticky :hover after a tap on touch devices. */
            @media (hover: hover) {
                ::part(cm-config-group-title):hover {
                    background-color: var(--section-color);
                    color: white;
                    cursor: pointer;
                }
            }

            ::part(cm-config-group-title-active),
            ::part(cm-config-group-title-stepped-into) {
                background-color: var(--section-color);
                color: white;
            }

            /* Section title: same fully-rounded pill, uppercase, left-aligned title. */
            ::part(cm-config-section-title) {
                position: relative;
                border: none;
                background-color: var(--section-inactive-bg);
                padding: 8px 36px 8px 18px;
                color: var(--section-inactive-color);
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                border-radius: 999px;
                justify-content: flex-start;
            }

            /* Chevrons: keep Font Awesome but bump the size. Both back/forward are
               absolutely positioned to the pill edges so they don't expand the
               line box (and thus don't change the pill's height). */
            ::part(cm-config-group-forward),
            ::part(cm-config-section-forward) {
                position: absolute;
                top: 50%;
                right: 14px;
                transform: translateY(-50%);
                font-size: 14px;
                font-weight: 900;
                line-height: 1;
                text-shadow:
                    0 0 0.8px currentColor,
                    0 0 0.8px currentColor;
            }

            ::part(cm-config-group-back),
            ::part(cm-config-section-back) {
                position: absolute;
                top: 50%;
                left: 14px;
                transform: translateY(-50%);
                font-size: 14px;
                font-weight: 900;
                line-height: 1;
                text-shadow:
                    0 0 0.8px currentColor,
                    0 0 0.8px currentColor;
            }

            /* Extra left padding when stepped-into to make room for the back chevron. */
            ::part(cm-config-group-title-stepped-into),
            ::part(cm-config-section-title-stepped-into) {
                padding-left: 36px;
            }

            /* Accordion open/close chevrons (autoClose/manualClose modes; the
               platform exposes them as cm-config-*-toggle parts, with an -open
               variant on expanded pills). Client feedback: sideways arrows on
               both sides — ">" pinned right to expand, "<" pinned left to
               collapse. The glyph overrides below work because outer ::part
               declarations beat the shadow-internal Font Awesome content rules. */
            ::part(cm-config-section-toggle),
            ::part(cm-config-group-toggle) {
                position: absolute;
                top: 50%;
                right: 14px;
                transform: translateY(-50%);
                font-size: 14px;
                font-weight: 900;
                line-height: 1;
                text-shadow:
                    0 0 0.8px currentColor,
                    0 0 0.8px currentColor;
            }

            ::part(cm-config-section-toggle)::before,
            ::part(cm-config-group-toggle)::before {
                content: "\f054"; /* fa-chevron-right */
            }

            ::part(cm-config-section-toggle-open),
            ::part(cm-config-group-toggle-open) {
                right: auto;
                left: 14px;
            }

            ::part(cm-config-section-toggle-open)::before,
            ::part(cm-config-group-toggle-open)::before {
                content: "\f053"; /* fa-chevron-left */
            }

            /* Make room for the left chevron on expanded pills (same offset as
               the stepped-into padding above). */
            ::part(cm-config-section-title-active),
            ::part(cm-config-group-title-active) {
                padding-left: 36px;
            }

            @media (hover: hover) {
                ::part(cm-config-section-title):hover {
                    background-color: var(--section-color);
                    color: white;
                    cursor: pointer;
                }
            }

            ::part(cm-config-section-title-active) {
                background-color: var(--section-color);
                color: white;
            }

            ::part(cm-icons-container),
            ::part(cm-labels-container) {
                /* Horizontal padding so the selected icon's outline (offset 2px +
                   2px stroke = 4px) isn't clipped by the container's overflow. */
                padding: 10px 6px;
            }

            /* stepInto accordion only: there the icons-container is the menu's
               scroll region, so it needs the bounded-height/own-scrollbar setup.
               It must not leak into the other modes: in autoClose the platform
               scrolls the whole menu instead (an icons-container gutter would
               waste ~15px per row), and in mobileTabs the icons row scrolls
               horizontally with hidden scrollbars — overflow-y: auto there
               shows a stray vertical scrollbar whenever the row is a few px
               taller than the menu. */
            cm-configurator-menu[ui-style="accordion"][accordion-style="stepInto"]::part(cm-icons-container),
            cm-configurator-menu[ui-style="accordion"][accordion-style="stepInto"]::part(cm-labels-container) {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                scrollbar-gutter: stable;
                /* Stack rows from the top — wrap-flex would otherwise center them. */
                align-content: flex-start;
            }

            /* Config buttons: always-round white circles with a light border. */
            ::part(cm-icon-container) {
                border: 1px solid #e6e6e6;
                border-radius: 50%;
                background-color: white;
                box-shadow: none;
            }

            @media (hover: hover) {
                ::part(cm-icon-container):hover {
                    border-color: var(--section-color);
                }
            }

            /* Selected variant — teal ring matching the section title accent.
               Requires the platform to emit `cm-icon-container-selected` on the
               selected button (see platform config-button.component.html). */
            ::part(cm-icon-container-selected) {
                outline: 2px solid var(--section-color);
                outline-offset: 2px;
            }

            /* Selection is shown by the outline above — hide the platform's
               built-in check overlay. */
            ::part(cm-active-variant-check) {
                display: none;
            }

            ::part(cm-icon-with-caption) {
                gap: 8px;
                font-size: 11px;
            }

            ::part(cm-caption) {
                text-align: center;
                color: #3a3a3a;
            }

            ::part(cm-caption-selected) {
                font-weight: 600;
                color: black;
            }

            cm-configurator-menu[ui-style="accordion"] {
                --cm-menu-icon-size: 80px;
                --cm-menu-max-num-cols: 5;
            }

            /* Scoped to accordion: mobileTabs uses the same part name but a different layout.
               The +32px accounts for: 20px outer padding (10px each side) plus 12px
               horizontal padding on the inner icons-container (6px each side, used to
               keep the selected icon's outline from being clipped). The section
               indent is added so an indented (second-level) icons row still fits
               the full column count. */
            cm-configurator-menu[ui-style="accordion"]::part(cm-config-menu-icons) {
                gap: 18px;
                padding: 10px;
                box-sizing: border-box;
                max-width: calc(
                    var(--cm-menu-max-num-cols) * var(--cm-menu-icon-size) + (var(--cm-menu-max-num-cols) - 1) * var(--cm-menu-gap) + 32px +
                        var(--cm-scrollbar-buffer) + var(--cm-section-indent)
                );
            }

            /* Match the outer wrapper's max-width so the inner cap doesn't shrink the
               row below 5 columns. */
            cm-configurator-menu[ui-style="accordion"]::part(cm-icons-container),
            cm-configurator-menu[ui-style="accordion"]::part(cm-labels-container) {
                max-width: calc(
                    var(--cm-menu-max-num-cols) * var(--cm-menu-icon-size) + (var(--cm-menu-max-num-cols) - 1) * var(--cm-menu-gap) + 12px +
                        var(--cm-scrollbar-buffer)
                );
            }

            /* Spacing between configs within a section (overrides the platform's
               default 8px gap on .cm-config-section). The explicit indent keeps
               second-level content visually nested under its section pill in
               autoClose mode — set via var so the width caps can account for it. */
            ::part(cm-config-section) {
                gap: 18px;
                padding-left: var(--cm-section-indent);
            }

            /* Override the platform's default max-width: 75vw. */
            cm-configurator-menu[ui-style="mobileTabs"]::part(cm-config-menu-icons) {
                max-width: 100%;
            }

            /* Mobile tabs pills: same gray pill look as the accordion side panel.
               No chevrons here, so center the label and use symmetric padding. */
            cm-configurator-menu[ui-style="mobileTabs"]::part(cm-config-group-title) {
                justify-content: center;
                padding: 8px 18px;
            }

            /* Mobile tab menu panel: transparent (a wrapper pill below provides
               the visible background instead). */
            .cm-menu:has(cm-configurator-menu[ui-style="mobileTabs"]) {
                background-color: transparent;
            }

            /* Wrap the tabs row in a rounded container with the accordion
               panel's background color, so the pill-row visually sits inside
               the same surface as the accordion does. */
            cm-configurator-menu[ui-style="mobileTabs"]::part(cm-mobile-tabs-groups) {
                background-color: #eef0f1;
                border-radius: 999px;
                padding: 6px;
            }

            /* Mobile tabs scroll arrows: the platform absolute-positions these
               (4px from each edge, 24×24, white pill). Stretch them full-height
               and flush to the edges so the white→transparent fade covers the
               entire outward side; pin the chevron to the outer edge. */
            cm-configurator-menu[ui-style="mobileTabs"]::part(cm-scroll-arrow) {
                color: var(--section-color);
                border: none;
                border-radius: 0;
                box-shadow: none;
                width: 60px;
                height: 100%;
                top: 0;
                transform: none;
                padding: 0 14px;
                font-size: 14px;
                font-weight: 900;
                line-height: 1;
                text-shadow:
                    0 0 0.8px currentColor,
                    0 0 0.8px currentColor;
                z-index: 1;
            }

            cm-configurator-menu[ui-style="mobileTabs"]::part(cm-scroll-arrow-left) {
                left: 0;
                justify-content: flex-start;
                background: linear-gradient(to right, white 0%, white 50%, transparent 100%);
            }

            cm-configurator-menu[ui-style="mobileTabs"]::part(cm-scroll-arrow-right) {
                right: 0;
                justify-content: flex-end;
                background: linear-gradient(to left, white 0%, white 50%, transparent 100%);
            }

            cm-configurator-menu[ui-style="mobileTabs"]::part(cm-scroll-arrow):hover {
                color: var(--section-color);
            }

            /* Horizontal scroll wrapper for mobileTabs group selectors */
            ::part(cm-mobile-tabs-groups) {
                gap: 10px;
            }

            ::part(cm-scroll-arrow) {
                background: white;
                color: #666;
                border: 1px solid #ccc;
                box-shadow: none;
                width: 28px;
                height: 28px;
            }

            ::part(cm-scroll-arrow):hover {
                background: #555;
                color: white;
                border-color: #555;
            }

            .cm-viewer {
                flex-grow: 1;
                box-sizing: border-box;
                min-width: 0;
                min-height: 0;
            }

            /* Narrow embed (not viewport — see wrapper comment): menu drops to
               the bottom. Below 950px the 516px side menu would squeeze the
               viewer too much. */
            @container cm-embed (max-width: 949px) {
                .cm-embed {
                    flex-direction: column;
                }
                .cm-menu {
                    width: 100%;
                    min-width: 0;
                    /* Content-sized: mobileTabs is one tabs row + one icon row,
                       so its natural height is bounded. A fixed height (155px
                       previously) overflowed into a scrollbar when font or
                       scrollbar metrics differed from the ones it was tuned on. */
                    height: auto;
                    flex-shrink: 0;
                }
                /* Undo the accordion's height cascade — content decides here. */
                .cm-menu cm-configurator-menu {
                    height: auto;
                }
            }
        </style>
    </head>
    <body style="width: 100%; height: 100%; margin: 0">
        <div class="cm-configurator-wrapper">
            <div class="cm-embed">
                <div class="cm-viewer">
                    <!-- fullscreen-target: the fullscreen button fullscreens the whole
                         wrapper (viewer + external menu) so the menu keeps this page's
                         styling; without it the platform would fullscreen only the
                         viewer and fall back to its unstyled internal menu. -->
                    <cm-configurator-main
                        template-uuid="33dc5c71-1c0e-4e36-94b9-0bfeae9ddd50"
                        use-external-menu="true"
                        fullscreen-target=".cm-configurator-wrapper"
                    ></cm-configurator-main>
                </div>
                <div class="cm-menu">
                    <!-- Override the default settings for the menu appearance with "accordion"  -->
                    <cm-configurator-menu ui-style="accordion" accordion-style="autoClose" use-captions="true" style="width: 100%"></cm-configurator-menu>
                </div>
            </div>
        </div>
        <script>
            // Switch the configurator menu's ui-style based on the embed's own
            // width — must stay in sync with the @container breakpoint above.
            // Wide → accordion side panel. Narrow → mobileTabs strip at the bottom.
            const menu = document.querySelector("cm-configurator-menu")
            const wrapper = document.querySelector(".cm-configurator-wrapper")
            const observer = new ResizeObserver((entries) => {
                const next = entries[0].contentRect.width < 950 ? "mobileTabs" : "accordion"
                menu.setAttribute("ui-style", next)
            })
            // Fires once on observe, so this also sets the initial state.
            observer.observe(wrapper)
        </script>
    </body>
</html>
