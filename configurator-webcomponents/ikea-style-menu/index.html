<!doctype html>
<html style="height: 100%">
    <head>
        <link rel="preconnect" href="http://localhost:4300" />
        <!-- Load the colormass configurator styles -->
        <link href="http://localhost:4300/styles.css" rel="stylesheet" />
        <!-- Load the colormass configurator web components -->
        <script src="http://localhost:4300/cm-configurator.js" type="module"></script>

        <title>Configurator Web Component Example</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            :root {
                /* Available css variables */
                --cm-menu-max-num-cols: 8;
                --cm-menu-icon-size: 50px;
                --cm-menu-background-color: rgba(255, 255, 255, 0);
                --cm-tooltip-font-size: 14px;
                --cm-tooltip-background-color: gray;
                font-family: "Roboto";
                /* Theme accent — defined globally so part rules below can use it
                   regardless of which custom element they target. */
                --color: #d78a5e;
            }

            .container {
                display: flex;
                height: 100%;
                overflow: hidden;
            }

            .menu {
                justify-content: center;
                width: 15%;
                background-color: #f4f4f4;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                min-width: 400px;
            }

            /* Part rules are at document scope (not nested inside .menu) so they also
               match the menu rendered inside <cm-configurator-main> during fullscreen.
               The configurator forwards these parts via exportparts on cm-config-menu. */

            /* Accordion / icons UI */
            ::part(cm-config-group-title) {
                border-width: 1px;
                border-style: solid;
                border-color: rgba(0, 140, 153, 0);
                background-color: var(--color);
                padding: 10px;
                color: white;
                font-size: 16px;
            }

            ::part(cm-config-group-title):hover {
                border-width: 1px;
                border-style: solid;
                border-color: var(--color);
                background-color: rgba(255, 255, 255, 1);
                color: var(--color);
                cursor: pointer;
            }

            ::part(cm-config-group-title-active) {
                border-width: 1px;
                border-style: solid;
                border-color: var(--color);
                background-color: rgba(255, 255, 255, 1);
                color: var(--color);
            }

            ::part(cm-icons-container) {
                padding-top: 10px;
                padding-bottom: 10px;
            }

            ::part(cm-icon-container) {
                border-width: 1px;
                border-style: solid;
                border-color: rgba(0, 140, 153, 0);
            }

            ::part(cm-icon-container):hover {
                border-width: 1px;
                border-style: solid;
                border-color: var(--color);
            }

            ::part(cm-icon-with-caption) {
                gap: 8px;
                font-size: 10px;
            }

            ::part(cm-config-menu-icons) {
                gap: 10px;
            }

            /* Mobile tabs UI */
            ::part(cm-mobile-tabs-menu) {
                padding: 10px;
                /* Default is 75vw which leaves whitespace in our full-width strip.
                   100% fills the parent, but still bounds the content so overflowing
                   tabs trigger the scroll arrows. */
                max-width: 100%;
            }

            ::part(cm-mobile-tabs-groups) {
                gap: 10px;
            }

            ::part(cm-mobile-tab) {
                background-color: var(--color);
                color: white;
                padding: 8px 14px;
                font-size: 14px;
                font-weight: 500;
                border: 1px solid rgba(0, 140, 153, 0);
            }

            ::part(cm-mobile-tab):hover {
                background-color: white;
                color: var(--color);
                border-color: var(--color);
                cursor: pointer;
            }

            ::part(cm-mobile-tab-active) {
                background-color: white;
                color: var(--color);
                border-color: var(--color);
            }

            ::part(cm-mobile-tabs-variants),
            ::part(cm-mobile-tabs-labels) {
                gap: 10px;
                padding-top: 10px;
            }

            ::part(cm-scroll-arrow) {
                background: white;
                color: var(--color);
                border: 1px solid var(--color);
                box-shadow: none;
                width: 28px;
                height: 28px;
            }

            ::part(cm-scroll-arrow):hover {
                background: var(--color);
                color: white;
            }

            .configurator-container {
                flex-grow: 1;
                box-sizing: border-box;
                min-width: 0;
                min-height: 0;
            }

            /* Narrow viewport: menu drops to the bottom */
            @media (max-width: 900px) {
                .container {
                    flex-direction: column;
                }
                .menu {
                    width: 100%;
                    min-width: 0;
                    height: 140px;
                    flex-shrink: 0;
                }
            }
        </style>
    </head>
    <body style="width: 100%; height: 100%; margin: 0">
        <div class="container">
            <div class="configurator-container">
                <cm-configurator-main template-uuid="b047be1c-508b-47f3-9523-845b2dc943ae" use-external-menu="true"></cm-configurator-main>
            </div>
            <div class="menu">
                <!-- Override the default settings for the menu appearance with "accordion"  -->
                <cm-configurator-menu ui-style="accordion" accordion-style="autoClose" use-captions="true" style="width: 100%"></cm-configurator-menu>
            </div>
        </div>
        <script>
            // Switch the configurator menu's ui-style based on viewport width.
            // Wide → accordion side panel. Narrow → mobileTabs strip at the bottom.
            const menu = document.querySelector("cm-configurator-menu")
            const mq = window.matchMedia("(max-width: 900px)")
            const onSizeChange = () => {
                const next = mq.matches ? "mobileTabs" : "accordion"
                menu.setAttribute("ui-style", next)
            }
            onSizeChange("init")
            mq.addEventListener("change", onSizeChange)
            window.addEventListener("resize", onSizeChange)
        </script>
    </body>
</html>
