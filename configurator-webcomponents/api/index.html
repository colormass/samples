<!DOCTYPE html>
<html style="height: 100%">
    <head>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
        <link href="https://storage.googleapis.com/cm-platform-prod-static/fonts/fontawesome-pro-6.0.0-alpha3/css/all.css" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Roboto:200,300,400,500,600,700" rel="stylesheet" />
        <script src="https://cwc.colormass.com/cm-configurator.js" type="module"></script>
        <link rel="stylesheet" href="styles.css" />
        <title>Configurator Web Component Example</title>
        <meta charset="UTF-8" />
    </head>
    <body>
        <div class="container">
            <div class="menu">
                <div class="menu-controls">
                    <div class="menu-section">
                        <div class="parameter-grid">
                            <input type="text" id="templateUuid" placeholder="UUID" class="parameter-input full-width" />
                            <button id="loadConfigurator" class="full-width">Load configurator</button>
                        </div>
                    </div>
                    <div class="menu-section">
                        <div class="parameter-grid">
                            <div class="parameter-row">
                                <label class="parameter-label">ID:</label>
                                <div class="dual-input">
                                    <input type="text" id="parameterInput" class="parameter-input" />
                                    <select id="parameterSelect" class="parameter-input" disabled></select>
                                </div>
                            </div>
                            <div class="parameter-row">
                                <label class="parameter-label">Type:</label>
                                <input type="text" id="parameterTypeInput" class="parameter-input" />
                            </div>
                            <div class="parameter-row">
                                <label class="parameter-label">Value:</label>
                                <div class="dual-input">
                                    <input type="text" id="parameterValueInput" class="parameter-input" />
                                    <select id="parameterValueSelect" class="parameter-input" disabled></select>
                                </div>
                            </div>
                            <button id="updateParams" class="full-width">Update params</button>
                        </div>
                    </div>
                    <div class="menu-section">
                        <div class="button-group">
                            <button id="saveSnapshotButton">Save snapshot</button>
                            <button id="inMemorySnapshotButton">In-memory snapshot</button>
                        </div>
                    </div>
                    <div class="menu-section">
                        <div class="camera-controls">
                            <button id="zoomIn">Zoom in</button>
                            <button id="zoomOut">Zoom out</button>
                            <button id="resetCamera">Reset camera</button>
                        </div>
                    </div>
                </div>
                <cm-configurator-menu></cm-configurator-menu>
                <div class="image-container"></div>
            </div>
            <div class="configurator-container">
                <cm-configurator-main ui-style="default" template-uuid="8ee95263-fd7c-40fc-b99f-08961594e14e" use-external-menu="true"></cm-configurator-main>
            </div>
        </div>
        <script>
            let cmConfigurator, parameterList, selectedParameterId, selectedParameterType, selectedParameterValue

            customElements.whenDefined("cm-configurator-main").then(() => {
                cmConfigurator = document.querySelector("cm-configurator-main")
                cmConfigurator.addEventListener("loadingCompleted", initParameters)
                cmConfigurator.addEventListener("arUrl", (event) => displayQrCode(event.detail))
                cmConfigurator.addEventListener("configurationLoaded", async (event) => console.log("prices: ", await cmConfigurator.getPricesAsList()))

                document.getElementById("loadConfigurator").addEventListener("click", loadConfigurator)
                document.getElementById("updateParams").addEventListener("click", updateParams)
                document.getElementById("parameterSelect").addEventListener("change", parameterChange)
                document.getElementById("parameterTypeInput").addEventListener("change", parameterTypeChange)
                document.getElementById("parameterValueSelect").addEventListener("change", parameterValueChange)
                document.getElementById("parameterValueInput").addEventListener("change", parameterValueChange)
                document.getElementById("zoomIn").addEventListener("click", () => zoomIn(0.1))
                document.getElementById("zoomOut").addEventListener("click", () => zoomOut(0.1))
                document.getElementById("resetCamera").addEventListener("click", resetCamera)
                document.getElementById("saveSnapshotButton").addEventListener("click", () => cmConfigurator.saveSnapshot())
                document.getElementById("inMemorySnapshotButton").addEventListener("click", inMemorySnapshot)
            })

            async function loadConfigurator() {
                clearParameters()
                document.querySelector(".image-container").innerHTML = ""
                cmConfigurator.loadConfigurator(document.getElementById("templateUuid").value)
            }

            function displayQrCode(url) {
                cmConfigurator
                    .generateQrCode(url, "low", 200, 0)
                    .then((qrImage) => {
                        const img = new Image()
                        img.src = qrImage
                        document.querySelector(".image-container").appendChild(img)
                    })
                    .catch((error) => console.log("Could not capture snapshot in memory.", error))
            }

            function inMemorySnapshot() {
                cmConfigurator
                    .captureSnapshotInMemory()
                    .then((snapshot) => {
                        const img = new Image()
                        img.src = snapshot
                        document.querySelector(".image-container").appendChild(img)
                    })
                    .catch((error) => console.log("Could not capture snapshot in memory.", error))
            }

            async function initParameters() {
                parameterList = await cmConfigurator.getParameterList()
                console.log("Available parameters:", parameterList)
                const parameterSelect = document.getElementById("parameterSelect")
                parameterList.forEach((param) => (parameterSelect.options[parameterSelect.options.length] = new Option(param.name, param.id)))
                parameterSelect.disabled = false
                parameterSelect.dispatchEvent(new Event("change"))
            }

            function parameterChange(event) {
                selectedParameterId = event.target.value
                document.getElementById("parameterInput").value = selectedParameterId
                const parameter = parameterList.find((param) => param.id === selectedParameterId)
                selectedParameterType = parameter.type
                document.getElementById("parameterTypeInput").value = selectedParameterType

                clearParameterValues()
                const parameterValues = parameter.values
                const parameterValueSelect = document.getElementById("parameterValueSelect")
                if (!parameterValues) {
                    parameterValueSelect.disabled = true
                    document.getElementById("parameterValueInput").value = ""
                } else {
                    parameterValues.forEach((param) => (parameterValueSelect.options[parameterValueSelect.options.length] = new Option(param.name, param.id)))
                    parameterValueSelect.disabled = false
                    parameterValueSelect.dispatchEvent(new Event("change"))
                }
            }

            function parameterTypeChange(event) {
                selectedParameterType = event.target.value
            }

            function parameterValueChange(event) {
                selectedParameterValue = event.target.value
                document.getElementById("parameterInput").value = selectedParameterId
                document.getElementById("parameterTypeInput").value = selectedParameterType
                document.getElementById("parameterValueInput").value = selectedParameterValue
            }

            async function updateParams() {
                await cmConfigurator.setParameter(selectedParameterId, selectedParameterType, selectedParameterValue)
                console.log("Setting parameter completed.")
            }

            function clearParameterValues() {
                const parameterValueSelect = document.getElementById("parameterValueSelect")
                while (parameterValueSelect.options.length > 0) {
                    parameterValueSelect.remove(0)
                }
            }

            function clearParameters() {
                const parameterSelect = document.getElementById("parameterSelect")
                while (parameterSelect.options.length > 0) {
                    parameterSelect.remove(0)
                }
                document.getElementById("parameterInput").value = ""
                document.getElementById("parameterTypeInput").value = ""
                document.getElementById("parameterValueInput").value = ""
                clearParameterValues()
            }

            function zoomIn(value) {
                cmConfigurator.zoomIn(value)
            }
            function zoomOut(value) {
                cmConfigurator.zoomOut(value)
            }
            function resetCamera() {
                cmConfigurator.resetCamera()
            }
        </script>
    </body>
</html>
